<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4623" />
      <stop offset="100%" stop-color="#232B14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="50%" stop-color="#E29B38" />
      <stop offset="100%" stop-color="#C87518" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5BC74" />
      <stop offset="100%" stop-color="#728B47" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Round Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Elegant Outer Ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#E29B38" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="2 2" />

  <!-- Botanical Emblem Group -->
  <g filter="url(#glow)">
    <!-- Sunburst Radiance rays behind the drop -->
    <path d="M32 9 L32 13 M32 51 L32 55 M11 32 L15 32 M49 32 L53 32 M17 17 L20 20 M44 44 L47 47 M17 47 L20 44 M44 20 L47 17" stroke="#FDE08B" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.45" />

    <!-- Left Olive Leaf -->
    <path d="M32 30 C23 27 18 20 20 14 C26 15 31 21 32 30 Z" fill="url(#leafGrad)" />
    
    <!-- Right Olive Leaf -->
    <path d="M32 30 C41 27 46 20 44 14 C38 15 33 21 32 30 Z" fill="url(#leafGrad)" opacity="0.9" />

    <!-- Central Golden Olive Oil Drop / Flame -->
    <path d="M32 18 C32 18 42 32 42 39 C42 45.075 37.523 49 32 49 C26.477 49 22 45.075 22 39 C22 32 32 18 32 18 Z" fill="url(#goldGrad)" />

    <!-- Gloss Highlight on Drop -->
    <path d="M28 34 C26.5 36.5 26.5 40 28 43 C26.5 42 25 39.5 26 36 C26.6 33.5 28.5 30 28.5 30 C28.5 30 27.5 32 28 34 Z" fill="#FFFFFF" opacity="0.65" />
    
    <!-- Terracotta Accent Dot (Artisan Harvest Core) -->
    <circle cx="32" cy="39" r="2.8" fill="#C85A32" />
  </g>
</svg>
