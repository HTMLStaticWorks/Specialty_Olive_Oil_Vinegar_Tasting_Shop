<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harvest Member Sign In | SOLARIA &amp; TERRA Botanical Press</title>
  <meta name="description" content="Sign in to your SOLARIA &amp; TERRA harvest member account for curated olive oil allocations and order tracking.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body class="auth-page-body">

  <!-- Top Header with Navigation & Quick Controls -->
  <header class="auth-page-header">
    <a href="index.html" class="site-logo" aria-label="SOLARIA &amp; TERRA Homepage">
      <img src="favicon.svg" alt="SOLARIA &amp; TERRA Botanical Mark" class="brand-mark" width="36" height="36">
      <div class="site-logo-text">
        <span class="brand-name">SOLARIA &amp; TERRA</span>
        <span class="brand-tagline">Botanical Olive Oils &amp; Vinegars</span>
      </div>
    </a>

    <div class="flex items-center gap-3">
      <!-- Theme & RTL Controls -->
      <div class="navbar-util-pill" aria-label="Theme and Language Controls">
        <button class="navbar-util-btn theme-toggle-trigger" onclick="App.toggleTheme()" title="Toggle Dark/Light Theme" aria-label="Toggle Theme">
          🌙
        </button>
        <button class="navbar-util-btn rtl-toggle-trigger" onclick="App.toggleRTL()" title="Toggle Right-to-Left (RTL) Layout" aria-label="Toggle RTL Mode">
          ⇄
        </button>
      </div>
    </div>
  </header>

  <!-- Centered Login Card -->
  <main class="auth-page-container">
    <div class="auth-page-card">
      
      <!-- Emblem Centerpiece -->
      <div style="margin-bottom: 1.25rem; display: flex; justify-content: center;">
        <div style="width: 50px; height: 50px; border-radius: 12px; background-color: var(--color-canvas-subtle); border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);">
          <img src="favicon.svg" alt="SOLARIA &amp; TERRA Botanical Mark" width="30" height="30">
        </div>
      </div>

      <h1 style="font-size: 1.5rem; margin-bottom: 0.35rem;">Harvest Member Sign In</h1>
      <p style="font-size: 0.85rem; color: var(--color-text-secondary); margin-bottom: 1.5rem;">
        Access your seasonal pressing allocations, tasting flight records, and saved gift recipients.
      </p>

      <!-- Social Logins -->
      <div class="social-auth-grid">
        <button type="button" class="social-auth-btn" onclick="App.showToast('Connecting with Google...', 'info')">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          <span>Continue with Google</span>
        </button>
        <button type="button" class="social-auth-btn" onclick="App.showToast('Connecting with Apple...', 'info')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.62-.75 1.04-1.8 0.92-2.84-.9.04-1.99.6-2.64 1.35-.57.65-1.07 1.72-.94 2.72 1.01.08 2.04-.48 2.66-1.23z"/></svg>
          <span>Continue with Apple</span>
        </button>
      </div>

      <div class="auth-divider">
        <span>or sign in with email</span>
      </div>

      <!-- Sign In Form -->
      <form id="standaloneLoginForm" onsubmit="event.preventDefault(); App.handleStandaloneAuth('login');" style="width: 100%; text-align: left;">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <div class="flex justify-between items-center" style="margin-bottom: 0.45rem;">
            <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
            <a href="#" onclick="event.preventDefault(); App.showToast('Password reset link sent to your email!', 'info');" style="font-size: 0.78rem; color: var(--color-terracotta); text-decoration: none;">Forgot Password?</a>
          </div>
          
          <div class="password-input-wrapper">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
            <button type="button" class="password-toggle-btn" id="loginPasswordToggle" onclick="App.togglePasswordVisibility('loginPassword', 'loginPasswordToggle')" aria-label="Toggle password visibility">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="form-group" style="margin-top: 0.75rem;">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="rememberMeCheck" checked>
            <span>Remember my session on this device</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.75rem;">
          Sign In to Harvest Account
        </button>
      </form>

      <!-- Respected Link to Sign-Up Page -->
      <div class="auth-page-footer-note">
        Don’t have a Harvest Member account? <a href="signup.html">Create Account &rarr;</a>
      </div>

    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
